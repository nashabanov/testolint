name: CI

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
      - run: make test
      - run: go vet ./...
      - run: go mod tidy && git diff --exit-code
      - run: golangci-lint custom -v
      - run: TESTOLINT_GOLANGCI_BINARY="$PWD/bin/golangci-lint" go test ./plugin/golangci -run '^TestIntegration$' -count=1 -v
      - run: go test ./clean
        working-directory: plugin/golangci/testdata/integration
